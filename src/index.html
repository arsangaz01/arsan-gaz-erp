<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arsan Gaz ERP</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:#f1f5f9;color:#0f172a}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}aside{background:#071426;color:#fff;padding:22px}.brand{font-size:22px;font-weight:800}.sub{color:#94a3b8;margin:6px 0 22px}.nav button{display:flex;width:100%;padding:11px 12px;margin:4px 0;border:0;border-radius:10px;background:transparent;color:#cbd5e1;text-align:left;cursor:pointer}.nav button.active,.nav button:hover{background:#2563eb;color:white}main{padding:26px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border:1px solid #dbe3ee;border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 2px 6px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.metric b{font-size:24px}.hide{display:none}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:8px}input,select,textarea{width:100%}.primary{background:#2563eb;color:white;border:0}.danger{background:#dc2626;color:#fff;border:0}.good{background:#059669;color:#fff;border:0}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left}.pill{padding:3px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8}.chat{height:380px;overflow:auto;background:#f8fafc;padding:12px;border-radius:10px}.msg{padding:10px;margin:8px 0;border-radius:10px;background:#e2e8f0}.user{background:#dbeafe}.warn{background:#fff7ed;border-color:#fdba74}.small{font-size:12px;color:#64748b}@media(max-width:1000px){.app{grid-template-columns:1fr}aside{position:relative}.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside><div class="brand">ARSAN GAZ ERP</div><div class="sub">AI İş Yönetim ve Ajan Sistemi</div><div id="nav" class="nav"></div><div class="small" style="margin-top:20px;color:#94a3b8">Sürüm <span id="version">3.0.0</span><br>Yerel güvenli veri</div></aside><main><div class="top"><h1 id="title">Kontrol Merkezi</h1><span class="pill">Onay koruması açık</span></div><div id="view"></div></main></div><script>
const defaultProducts=[['Y.S. HELYUM GAZI',200,9.2],['SAF HELYUM GAZI',200,9.2],['Y.S. ARGON GAZI',230,12.06],['Y.S. AZOT GAZI',230,10.5],['SAF HİDROJEN GAZI',200,8.9],['Y.S. HİDROJEN GAZI',200,8.9],['Y.S. OKSİJEN GAZI',200,10.6],['KURU HAVA 4.8',200,9.8],['KURU HAVA 5.0',200,9.8],['P10 GAZI',200,10.7],['ASETİLEN',18,6.5],['BALON GAZI',200,9.2]].map((x,i)=>({id:i+1,name:x[0],bar:x[1],capacity:x[2],buy:null,sell:null,currency:'TRY',vat:20,stock:0}));
const seed={customers:[],leads:[],products:defaultProducts,quotes:[],cylinders:[],deliveries:[],invoices:[],payments:[],tasks:[],agentRuns:[],settings:{usd:1,eur:1,gbp:1}};let db;try{db={...seed,...JSON.parse(localStorage.getItem('arsanERPv3'))}}catch{db=seed}const P=[['dash','Kontrol Merkezi'],['leads','Müşteri Avcısı'],['crm','CRM ve Satış'],['prices','Ürün ve Fiyat'],['quotes','Teklif Yönetimi'],['cylinders','Tüp ve Barkod'],['delivery','Sevkiyat'],['finance','Fatura ve Tahsilat'],['tasks','Görevler'],['agents','Ajan Merkezi'],['ai','Arsan AI Copilot'],['settings','Ayarlar ve Yedek']];let current='dash';
function save(){localStorage.setItem('arsanERPv3',JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(n||0))}function id(){return Date.now()+Math.floor(Math.random()*999)}function go(p,b){current=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b?.classList.add('active');title.textContent=P.find(x=>x[0]===p)[1];render()}
function render(){nav.innerHTML=P.map(x=>`<button class="${current===x[0]?'active':''}" onclick="go('${x[0]}',this)">${x[1]}</button>`).join('');const f={dash:dashboard,leads:leadView,crm:crmView,prices:priceView,quotes:quoteView,cylinders:cylinderView,delivery:deliveryView,finance:financeView,tasks:taskView,agents:agentView,ai:aiView,settings:settingsView};view.innerHTML=f[current]();}
function dashboard(){const due=db.invoices.filter(x=>x.status!=='Ödendi').reduce((s,x)=>s+Number(x.amount),0),custCyl=db.cylinders.filter(x=>x.location==='Müşteri').length;return `<div class=grid><div class="card metric"><b>${db.customers.length}</b><p>Müşteri</p></div><div class="card metric"><b>${db.leads.length}</b><p>Aday</p></div><div class="card metric"><b>${db.quotes.length}</b><p>Teklif</p></div><div class="card metric"><b>${db.cylinders.length}</b><p>Tüp</p></div><div class="card metric"><b>${money(due)}</b><p>Bekleyen Tahsilat</p></div><div class="card metric"><b>${custCyl}</b><p>Müşterideki Tüp</p></div><div class="card metric"><b>${db.tasks.filter(x=>x.status!=='Tamamlandı').length}</b><p>Açık Görev</p></div><div class="card metric"><b>${db.agentRuns.length}</b><p>Ajan Çalışması</p></div></div><div class="card"><h2>Operasyon özeti</h2><p>CRM, teklif, tüp, sevkiyat, finans ve ajan modülleri tek yerel veritabanında çalışır. Dış iletişim ve mali işlemler insan onayı ister.</p></div>`}
function leadView(){return `<div class=card><h2>Potansiyel müşteri ekle</h2><div class=row><input id=lco placeholder="Firma"><select id=lci>${['Adana','Mersin','Hatay','Osmaniye','Gaziantep','Şanlıurfa'].map(x=>`<option>${x}</option>`)}</select><input id=lsec placeholder="Sektör"><input id=lneed placeholder="Gaz ihtiyacı"><button class=primary onclick=addLead()>Ekle</button></div></div>${table(['Firma','Şehir','Sektör','İhtiyaç','Puan','İşlem'],db.leads.map(x=>[x.company,x.city,x.sector,x.need,x.score,`<button onclick="leadToCustomer(${x.id})">CRM'e aktar</button>`]))}`}
function addLead(){if(!lco.value.trim())return;db.leads.unshift({id:id(),company:lco.value,city:lci.value,sector:lsec.value,need:lneed.value,score:50,stage:'Yeni'});save()}function leadToCustomer(i){let x=db.leads.find(y=>y.id===i);if(!x)return;db.customers.unshift({id:id(),company:x.company,city:x.city,status:'Potansiyel',phone:'',email:'',contact:'',notes:x.need});x.stage='Müşteriye dönüştü';save()}
function crmView(){return `<div class=card><h2>Müşteri kartı</h2><div class=row><input id=ccompany placeholder="Firma"><input id=ccontact placeholder="Yetkili"><input id=cphone placeholder="Telefon"><input id=cemail placeholder="E-posta"><button class=primary onclick=addCustomer()>Kaydet</button></div><div class=row><input id=ccity placeholder="İl"><input id=cdistrict placeholder="İlçe"><select id=cstatus><option>Potansiyel</option><option>Aktif</option><option>Pasif</option></select><input id=cnotes placeholder="Not"><span></span></div></div>${table(['Firma','Yetkili','Telefon','E-posta','İl','Durum'],db.customers.map(x=>[x.company,x.contact,x.phone,x.email,x.city,x.status]))}`}
function addCustomer(){if(!ccompany.value.trim())return;db.customers.unshift({id:id(),company:ccompany.value,contact:ccontact.value,phone:cphone.value,email:cemail.value,city:ccity.value,district:cdistrict.value,status:cstatus.value,notes:cnotes.value});save()}
function priceView(){return `<div class=card><h2>Ürün ve fiyatlar</h2><p class=small>Alış fiyatı müşteriye gösterilmez. Satış ve kârlılık yerel hesaplanır.</p>${db.products.map(x=>`<div class=row><b>${esc(x.name)}<br><small>${x.bar} bar · ${x.capacity} m³</small></b><input type=number value="${x.buy??''}" placeholder="Alış" onchange="product(${x.id},'buy',this.value)"><input type=number value="${x.sell??''}" placeholder="Satış" onchange="product(${x.id},'sell',this.value)"><select onchange="product(${x.id},'currency',this.value)">${['TRY','USD','EUR','GBP'].map(c=>`<option ${c===x.currency?'selected':''}>${c}</option>`)}</select><input type=number value="${x.stock}" placeholder="Stok" onchange="product(${x.id},'stock',this.value)"></div>`).join('')}</div>`}function product(i,k,v){let x=db.products.find(y=>y.id===i);x[k]=['buy','sell','stock'].includes(k)?(v===''?null:Number(v)):v;save()}
function quoteView(){return `<div class=card><h2>Teklif oluştur</h2><div class=row><input id=qcust placeholder="Müşteri"><select id=qprod>${db.products.map(x=>`<option value=${x.id}>${x.name}</option>`)}</select><input id=qqty type=number value=1><input id=qdays type=number value=30 placeholder="Geçerlilik"><button class=primary onclick=addQuote()>Kaydet</button></div></div>${table(['No','Müşteri','Ürün','Adet','Toplam TL','Durum'],db.quotes.map(x=>[x.no,x.customer,x.product,x.qty,money(x.total),x.status]))}`}
function rate(c){return c==='TRY'?1:Number(db.settings[c.toLowerCase()]||1)}function addQuote(){let p=db.products.find(x=>x.id===Number(qprod.value));if(!qcust.value.trim())return alert('Müşteri gerekli');if(!(p.sell>0))return alert('Önce satış fiyatı belirleyin');let qty=Number(qqty.value||1),total=p.sell*qty*rate(p.currency)*(1+p.vat/100);db.quotes.unshift({id:id(),no:`ARS-T-${new Date().getFullYear()}-${String(db.quotes.length+1).padStart(4,'0')}`,customer:qcust.value,product:p.name,qty,total,status:'Taslak',validDays:Number(qdays.value||30)});save()}
function cylinderView(){return `<div class=card><h2>Tüp ekle / barkod</h2><div class=row><input id=barcode placeholder="Barkod / seri no"><select id=cyprod>${db.products.map(x=>`<option>${x.name}</option>`)}</select><select id=cystatus><option>Dolu</option><option>Boş</option><option>Testte</option><option>Bakımda</option></select><select id=cyloc><option>Depo</option><option>Taşımada</option><option>Müşteri</option></select><button class=primary onclick=addCylinder()>Ekle</button></div></div>${table(['Barkod','Ürün','Durum','Konum','Müşteri','Gün'],db.cylinders.map(x=>[x.barcode,x.product,x.status,x.location,x.customer||'',x.outDate?Math.floor((Date.now()-new Date(x.outDate))/86400000):0]))}`}
function addCylinder(){let b=barcode.value.trim()||`ARS-${String(db.cylinders.length+1).padStart(6,'0')}`;if(db.cylinders.some(x=>x.barcode===b))return alert('Barkod zaten kayıtlı');db.cylinders.unshift({id:id(),barcode:b,product:cyprod.value,status:cystatus.value,location:cyloc.value,customer:'',outDate:cyloc.value==='Müşteri'?new Date().toISOString():null});save()}
function deliveryView(){return `<div class=card><h2>Sevkiyat planla</h2><div class=row><input id=dno placeholder="Sevkiyat no"><input id=dcust placeholder="Müşteri"><input id=ddate type=date><input id=dvehicle placeholder="Araç"><button class=primary onclick=addDelivery()>Planla</button></div></div>${table(['No','Müşteri','Tarih','Araç','Durum'],db.deliveries.map(x=>[x.no,x.customer,x.date,x.vehicle,x.status]))}`}
function addDelivery(){db.deliveries.unshift({id:id(),no:dno.value||`SVK-${db.deliveries.length+1}`,customer:dcust.value,date:ddate.value,vehicle:dvehicle.value,status:'Planlandı'});save()}
function financeView(){return `<div class=grid2><div class=card><h2>Fatura taslağı</h2><input id=fcust placeholder="Müşteri"><input id=famount type=number placeholder="Tutar TL"><input id=fdue type=date><button class=primary onclick=addInvoice()>Taslak oluştur</button></div><div class="card warn"><h2>Onay kuralı</h2><p>Resmî fatura, iptal, iade ve para transferi otomatik yürütülmez. Sistem yalnız taslak ve uyarı üretir.</p></div></div>${table(['No','Müşteri','Tutar','Vade','Durum'],db.invoices.map(x=>[x.no,x.customer,money(x.amount),x.due,x.status]))}`}
function addInvoice(){db.invoices.unshift({id:id(),no:`FTR-${new Date().getFullYear()}-${String(db.invoices.length+1).padStart(4,'0')}`,customer:fcust.value,amount:Number(famount.value),due:fdue.value,status:'Taslak'});save()}
function taskView(){return `<div class=card><h2>Görev ekle</h2><div class=row><input id=ttitle placeholder="Görev"><input id=tdue type=date><select id=tpriority><option>Düşük</option><option>Orta</option><option>Yüksek</option><option>Acil</option></select><span></span><button class=primary onclick=addTask()>Ekle</button></div></div>${table(['Görev','Vade','Öncelik','Durum','İşlem'],db.tasks.map(x=>[x.title,x.due,x.priority,x.status,`<button onclick="doneTask(${x.id})">Tamamla</button>`]))}`}
function addTask(){if(!ttitle.value.trim())return;db.tasks.unshift({id:id(),title:ttitle.value,due:tdue.value,priority:tpriority.value,status:'Açık'});save()}function doneTask(i){db.tasks.find(x=>x.id===i).status='Tamamlandı';save()}
const agents=[['Satış Ajanı','Yüksek puanlı adayları ve takipsiz müşterileri analiz eder.'],['Teklif Ajanı','Fiyatı eksik ürünleri ve taslak teklifleri kontrol eder.'],['Stok Ajanı','Kritik ürün ve tüp stoklarını denetler.'],['Tüp Ajanı','Müşteride uzun kalan tüpleri işaretler.'],['Tahsilat Ajanı','Vadesi geçen faturaları listeler.'],['Sevkiyat Ajanı','Planlanan ve geciken sevkiyatları kontrol eder.'],['Yönetici Ajanı','Tüm ajan çıktılarını önceliklendirir.']];
function agentView(){return `<div class=grid2>${agents.map((a,i)=>`<div class=card><h3>${a[0]}</h3><p>${a[1]}</p><button class=primary onclick="runAgent(${i})">Çalıştır</button></div>`).join('')}</div><div class=card><h2>Son ajan raporları</h2>${db.agentRuns.slice(0,10).map(x=>`<p><b>${x.agent}</b> · ${new Date(x.time).toLocaleString('tr-TR')}<br>${x.result}</p>`).join('')||'<p>Henüz çalışma yok.</p>'}</div>`}
function agentResult(i){if(i===0)return `${db.leads.filter(x=>x.score>=80).length} yüksek puanlı aday, ${db.customers.filter(x=>x.status==='Potansiyel').length} potansiyel müşteri.`;if(i===1)return `${db.products.filter(x=>!x.sell).length} üründe satış fiyatı eksik, ${db.quotes.filter(x=>x.status==='Taslak').length} taslak teklif.`;if(i===2)return `${db.products.filter(x=>Number(x.stock)<5).length} kritik ürün stoku.`;if(i===3)return `${db.cylinders.filter(x=>x.location==='Müşteri'&&x.outDate&&(Date.now()-new Date(x.outDate))/86400000>60).length} tüp 60 günden uzun süredir müşteride.`;if(i===4)return `${db.invoices.filter(x=>x.status!=='Ödendi'&&x.due&&new Date(x.due)<new Date()).length} gecikmiş fatura.`;if(i===5)return `${db.deliveries.filter(x=>x.status==='Planlandı').length} planlı sevkiyat.`;return `Müşteri ${db.customers.length}, aday ${db.leads.length}, teklif ${db.quotes.length}, tüp ${db.cylinders.length}, açık görev ${db.tasks.filter(x=>x.status!=='Tamamlandı').length}.`}
function runAgent(i){let result=agentResult(i);db.agentRuns.unshift({id:id(),agent:agents[i][0],result,time:new Date().toISOString()});save()}
function aiView(){return `<div class=grid2><div class=card><h2>Arsan AI Copilot</h2><div id=chat class=chat>${(db.chat||[]).map(x=>`<div class="msg ${x.role==='Siz'?'user':''}"><b>${x.role}:</b> ${esc(x.text)}</div>`).join('')}</div><div class=actions><input id=prompt placeholder="Örn. müşterideki tüpleri ve gecikmiş faturaları özetle"><button class=primary onclick=askAI()>Sor</button></div></div><div class=card><h2>Hızlı komutlar</h2>${['İş özeti','Eksik fiyatlar','Gecikmiş faturalar','Müşterideki tüpler','Kritik stok','Yüksek puanlı adaylar'].map(x=>`<p><button onclick="quick('${x}')">${x}</button></p>`).join('')}</div></div>`}
function answer(q){q=q.toLocaleLowerCase('tr');if(q.includes('fiyat'))return agentResult(1);if(q.includes('fatura')||q.includes('tahsilat'))return agentResult(4);if(q.includes('tüp'))return `Toplam ${db.cylinders.length} tüp; ${db.cylinders.filter(x=>x.location==='Müşteri').length} müşteride.`;if(q.includes('stok'))return agentResult(2);if(q.includes('aday')||q.includes('müşteri'))return agentResult(0);return agentResult(6)}function askAI(){let q=prompt.value.trim();if(!q)return;db.chat=db.chat||[];db.chat.push({role:'Siz',text:q},{role:'Arsan AI',text:answer(q)});save()}function quick(q){db.chat=db.chat||[];db.chat.push({role:'Siz',text:q},{role:'Arsan AI',text:answer(q)});save()}
function settingsView(){return `<div class=grid2><div class=card><h2>Kur ayarları</h2><label>USD<input type=number value="${db.settings.usd}" onchange="setting('usd',this.value)"></label><label>EUR<input type=number value="${db.settings.eur}" onchange="setting('eur',this.value)"></label><label>GBP<input type=number value="${db.settings.gbp}" onchange="setting('gbp',this.value)"></label></div><div class=card><h2>Yedek ve güncelleme</h2><div class=actions><button class=primary onclick="backup()">JSON yedek al</button><button onclick="window.desktopAPI.checkUpdate()">Güncelleme kontrol et</button></div><p id=updateStatus class=small></p></div></div>`}function setting(k,v){db.settings[k]=Number(v);save()}function backup(){window.desktopAPI.saveBackup(JSON.stringify(db,null,2))}function table(h,rows){return `<div class=card><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length?'':'<p>Kayıt yok.</p>'}</div>`}
render();window.desktopAPI.version().then(v=>version.textContent=v);window.desktopAPI.onUpdateStatus(v=>{let x=document.getElementById('updateStatus');if(x)x.textContent=v});
</script></body></html>
