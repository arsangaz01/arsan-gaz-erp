<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arsan Gaz ERP</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f1f5f9;color:#172033}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{background:#081426;color:white;padding:22px}.nav button{display:block;width:100%;padding:11px;margin:5px 0;border:0;border-radius:10px;text-align:left;background:transparent;color:#cbd5e1}.nav button:hover,.nav button.active{background:#2563eb;color:white}main{padding:25px}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}input,select,button{padding:10px;border:1px solid #cbd5e1;border-radius:9px}.primary{background:#2563eb;color:white;border:0}.hide{display:none}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}@media(max-width:850px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside><h2>ARSAN GAZ ERP</h2><p>AI İş Yönetim Sistemi</p><div id="nav" class="nav"></div><small>Sürüm <span id="version">2.2.2</span></small></aside><main><h1 id="title">Kontrol Merkezi</h1><section id="home"></section><section id="crm" class="hide"></section><section id="prices" class="hide"></section><section id="quotes" class="hide"></section><section id="ai" class="hide"></section><section id="settings" class="hide"></section></main></div><script>
const seed={customers:[],products:['Helyum','Argon','Azot','Hidrojen','Oksijen','Asetilen'].map((name,i)=>({id:i+1,name,price:null,currency:'TRY'})),quotes:[]};let db;try{db=JSON.parse(localStorage.getItem('arsanERP'))||seed}catch{db=seed}const pages=[['home','Kontrol Merkezi'],['crm','CRM ve Satış'],['prices','Fiyat Yönetimi'],['quotes','Teklifler'],['ai','Arsan AI Copilot'],['settings','Ayarlar ve Güncelleme']];function save(){localStorage.setItem('arsanERP',JSON.stringify(db));render()}function show(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');title.textContent=pages.find(x=>x[0]===id)[1]}function render(){nav.innerHTML=pages.map((x,i)=>`<button class="${i?'':'active'}" onclick="show('${x[0]}',this)">${x[1]}</button>`).join('');home.innerHTML=`<div class=grid><div class=card><b>${db.customers.length}</b><p>Müşteri</p></div><div class=card><b>${db.products.filter(x=>x.price).length}</b><p>Fiyat tanımlı ürün</p></div><div class=card><b>${db.quotes.length}</b><p>Teklif</p></div></div><div class=card><h2>Arsan Gaz Operasyon Merkezi</h2><p>Veriler bu bilgisayarda yerel olarak saklanır.</p></div>`;crm.innerHTML=`<div class=card><h2>Müşteri ekle</h2><div class=grid><input id=cn placeholder="Firma adı"><input id=cc placeholder="Şehir"><button class=primary onclick=addCustomer()>Kaydet</button></div></div><div class=card><table><tr><th>Firma</th><th>Şehir</th></tr>${db.customers.map(x=>`<tr><td>${x.name}</td><td>${x.city}</td></tr>`).join('')}</table></div>`;prices.innerHTML=`<div class=card><h2>Manuel fiyat yönetimi</h2>${db.products.map(x=>`<div class=grid><label>${x.name}</label><input type=number value="${x.price??''}" placeholder="Fiyat" onchange="setPrice(${x.id},this.value)"><select onchange="setCurrency(${x.id},this.value)"><option>TRY</option><option>USD</option><option>EUR</option><option>GBP</option></select></div>`).join('')}</div>`;quotes.innerHTML=`<div class=card><h2>Teklif oluştur</h2><div class=grid><input id=qc placeholder="Müşteri"><select id=qp>${db.products.map(x=>`<option value=${x.id}>${x.name}</option>`).join('')}</select><input id=qq type=number value=1><button class=primary onclick=makeQuote()>Kaydet</button></div></div><div class=card><table><tr><th>Müşteri</th><th>Ürün</th><th>Toplam</th></tr>${db.quotes.map(x=>`<tr><td>${x.customer}</td><td>${x.product}</td><td>${x.total} TRY</td></tr>`).join('')}</table></div>`;ai.innerHTML=`<div class=card><h2>Arsan AI Copilot</h2><input id=prompt placeholder="Eksik fiyatları veya müşteri sayısını sor"><button class=primary onclick=ask()>Sor</button><p id=answer></p></div>`;settings.innerHTML=`<div class=card><h2>Güncelleme</h2><button class=primary onclick="window.desktopAPI.checkUpdate()">Şimdi kontrol et</button><p id=updateStatus></p></div>`}function addCustomer(){if(!cn.value.trim())return;db.customers.push({id:Date.now(),name:cn.value,city:cc.value});save()}function setPrice(id,v){db.products.find(x=>x.id===id).price=v?Number(v):null;save()}function setCurrency(id,v){db.products.find(x=>x.id===id).currency=v;save()}function makeQuote(){const p=db.products.find(x=>x.id===Number(qp.value));if(!qc.value.trim())return alert('Müşteri gerekli');if(!p.price)return alert('Önce fiyat belirleyin');db.quotes.unshift({id:Date.now(),customer:qc.value,product:p.name,total:p.price*Number(qq.value)});save()}function ask(){const q=prompt.value.toLocaleLowerCase('tr');answer.textContent=q.includes('fiyat')?'Fiyatı eksik ürünler: '+db.products.filter(x=>!x.price).map(x=>x.name).join(', '):q.includes('müşteri')?`${db.customers.length} müşteri var.`:'Fiyat, müşteri ve teklif kayıtlarını analiz edebilirim.'}render();window.desktopAPI.version().then(v=>version.textContent=v);window.desktopAPI.onUpdateStatus(v=>updateStatus.textContent=v);
</script></body></html>
